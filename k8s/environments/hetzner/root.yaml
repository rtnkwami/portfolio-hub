apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/rtnkwami/portfolio-hub.git
    path: k8s/charts/bootstrap
    targetRevision: HEAD
    valuesFiles:
      - ../../environments/hetzner/values.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true