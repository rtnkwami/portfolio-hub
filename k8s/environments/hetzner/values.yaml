operators:
  externalDns:
    values:
      provider:
        name: cloudflare
      env:
        - name: CF_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-dns-token
              key: token
      txtOwnerId: homelab

config:
  clusterIssuer:
    enabled: true
    name: letsencrypt-dns01
    email: cert-alerts@niovial.io
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef: letsencrypt-staging
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-dns-token
              key: token
  
  clusterSecretStore:
    enabled: true
    name: infisical
    provider:
      infisical:
        hostAPI: https://app.infisical.com
        auth:
          universalAuthCredentials:
            clientId:
              name: infisical-credentials
              key: clientId
              namespace: external-secrets
            clientSecret:
              name: infisical-credentials
              key: clientSecret
              namespace: external-secrets
        secretsScope:
          projectSlug: homelab-43la
          environmentSlug: staging
  
  gateway:
    enabled: true
    name: hetzner-gateway
    namespace: default
    class: cilium
    infrastructureAnnotations:
      load-balancer.hetzner.cloud/name: "cilium-gateway-nbg1"
      load-balancer.hetzner.cloud/location: "nbg1"
      load-balancer.hetzner.cloud/uses-proxyprotocol: "true"
    hostname: "niovial.io"
    tlsSecretName: niovial-io-tls