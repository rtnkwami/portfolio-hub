apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zitadel-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://github.com/rtnkwami/portfolio-hub.git
    path: k8s/charts/zitadel
    targetRevision: HEAD
    helm:
      valuesObject:
      {{- toYaml .Values.zitadel | nindent 8 }}
  destination:
    namespace: zitadel
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true