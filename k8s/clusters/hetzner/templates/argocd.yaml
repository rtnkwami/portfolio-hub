apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  project: default
  source:
    chart: argo-cd
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 10.2.2
    helm:
      valuesObject:
        global:
          topologySpreadConstraints:
            - topologyKey: "topology.kubernetes.io/zone"
              maxSkew: 1
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: argocd
              matchLabelKeys: ["pod-template-hash"]
        {{- with .Values.genesis.controllers.nodePlacement.nodeSelector }}
        nodeSelector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.genesis.controllers.nodePlacement.tolerations }}
        tolerations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        configs:
          params:
            server.insecure: true
            controller.diff.server.side: true
          cm:
            resource.customizations.health.argoproj.io_Application: |
              hs = {}
              hs.status = "Progressing"
              hs.message = ""
              if obj.status ~= nil then
                if obj.status.health ~= nil then
                  hs.status = obj.status.health.status
                  if obj.status.health.message ~= nil then
                    hs.message = obj.status.health.message
                  end
                end
              end
              return hs
        redis-ha:
          enabled: true
          {{- with .Values.genesis.controllers.nodePlacement.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          haproxy:
          {{- with .Values.genesis.controllers.nodePlacement.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        redisSecretInit:
          {{- with .Values.genesis.controllers.nodePlacement.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.genesis.controllers.nodePlacement.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        controller:
          replicas: 1
        server:
          replicas: 2
        repoServer:
          replicas: 2
        applicationSet:
          replicas: 2
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 10s
    syncOptions:
      - ServerSideApply=true