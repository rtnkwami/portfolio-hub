apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: genesis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://github.com/rtnkwami/portfolio-hub.git
    path: k8s/charts/genesis
    targetRevision: HEAD
    helm:
      valuesObject:
      {{- toYaml .Values.genesis | nindent 8 }}
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true