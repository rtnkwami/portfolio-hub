apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: karpenter
  namespace: flux-system
spec:
  interval: 2h
  type: "oci"
  url: oci://public.ecr.aws/karpenter
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karpenter
  namespace: flux-system
spec:
  dependsOn:
    - name: vm-stack
  # interval at which HelmRelease config is reconciled
  interval: 1m
  targetNamespace: kube-system
  install:
    crds: Create
    createNamespace: true
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
  chart:
    spec:
      chart: karpenter
      version: 1.11.1
      sourceRef:
        kind: HelmRepository
        name: karpenter
        namespace: flux-system
      # interval at which chart source is reconciled
      interval: 2h
  values:
    nodeSelector:
      niovial.io/node-purpose: system
    # see terraform/eks/eks.tf for cluster name, interruption queue and service account for
    # pod identity
    settings:
      clusterName: portfolio-eks-cluster
      interruptionQueue: karpenter-interruption-queue-portfolio-eks-cluster
    serviceAccount:
      name: "karpenter"