apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-node-scaling
  interval: 2m
  targetNamespace: flux-system
  sourceRef:
    kind: GitRepository
    name: portfolio-hub
  path: "./k8s/cluster/infra/observability"
  prune: true
  timeout: 1m
  patches:
    - patch: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: node-exporter
          labels:
            pod-security.kubernetes.io/enforce: privileged
      target:
        kind: Namespace
        name: node-exporter
    - patch: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vlogs-collector
          labels:
            pod-security.kubernetes.io/enforce: privileged
      target:
        kind: Namespace
        name: vlogs-collector