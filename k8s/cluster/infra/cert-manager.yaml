apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 2h
  url: oci://quay.io/jetstack/charts/cert-manager
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 1.20.2
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  # interval at which HelmRelease config is reconciled
  interval: 10m
  targetNamespace: cert-manager
  # cert-manager's helm chart manages its own crds, and so no need for
  # install.crds or upgrade.crds
  upgrade:
    cleanupOnFail: true
  chart:
    spec:
      chart: .
      sourceRef:
        kind: OCIRepository
        name: cert-manager
        namespace: flux-system
      # interval at which chart source is reconciled
      interval: 2h
  values:
    global:
      nodeSelector:
        niovial.io/node-purpose: system
    crds:
      enabled: true
    config:
      enableGatewayAPI: true
    webhook:
      tolerations:
        - key: niovial.io/node-purpose
          operator: Equal
          value: system
          effect: NoSchedule
    cainjector:
      tolerations:
        - key: niovial.io/node-purpose
          operator: Equal
          value: system
          effect: NoSchedule
    startupapicheck:
      tolerations:
        - key: niovial.io/node-purpose
          operator: Equal
          value: system
          effect: NoSchedule