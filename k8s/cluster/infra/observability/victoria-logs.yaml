apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vlogs
  namespace: flux-system
spec:
  interval: 2h
  type: "oci"
  url: oci://ghcr.io/victoriametrics/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vlogs
  namespace: flux-system
spec:
  dependsOn:
    - name: vm-stack
  # interval at which HelmRelease config is reconciled
  interval: 1m
  targetNamespace: observability
  install:
    createNamespace: true
  upgrade:
    cleanupOnFail: true
  chart:
    spec:
      chart: victoria-logs-single
      version: 0.13.8
      sourceRef:
        kind: HelmRepository
        name: vlogs
        namespace: flux-system
      # interval at which chart source is reconciled
      interval: 2h
  values:
    server:
      serviceMonitor:
        enabled: true
      nodeSelector:
        niovial.io/node-purpose: system
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists