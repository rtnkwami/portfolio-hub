apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 2m
  sourceRef:
    kind: GitRepository
    name: portfolio-hub
  path: "./k8s/cluster/infra/observability"
  prune: true
  timeout: 1m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: vm-stack
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-node-scaling
  namespace: flux-system
spec:
  dependsOn:
    - name: observability
  interval: 2m
  sourceRef:
    kind: GitRepository
    name: portfolio-hub
  path: "./k8s/cluster/infra/node-scaling/karpenter"
  prune: true
  timeout: 1m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-operators
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-node-scaling
  interval: 2m
  sourceRef:
    kind: GitRepository
    name: portfolio-hub
  path: "./k8s/cluster/infra/operators"
  prune: true
  timeout: 1m