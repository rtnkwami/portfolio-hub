apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 2h
  url: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 0.28.3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: flux-system
spec:
  # interval at which HelmRelease config is reconciled
  interval: 10m
  targetNamespace: cnpg-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
    cleanUpOnFail: true
  chart:
    spec:
      chart: .
      sourceRef:
        kind: OCIRepository
        name: karpenter
        namespace: flux-system
      # interval at which chart source is reconciled
      interval: 2h
  values:
    nodeSelector:
      niovial.io/node-purpose: system
    tolerations:
      - key: niovial.io/node-purpose
        operator: Equal
        value: system
        effect: NoSchedule
    monitoring:
      podMonitorEnabled: true
      grafanaDashboard:
        create: true