apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-operators
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-node-scaling
  interval: 2m
  sourceRef:
    kind: GitRepository
    name: portfolio-hub
  path: "./k8s/cluster/infra/operators"
  prune: true
  timeout: 1m