apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-node-scaling
  namespace: flux-system
spec:
  interval: 2m
  targetNamespace: flux-system
  sourceRef:
    kind: GitRepository
    name: portfolio-hub
  path: "./k8s/cluster/infra/node-scaling"
  prune: true
  timeout: 1m