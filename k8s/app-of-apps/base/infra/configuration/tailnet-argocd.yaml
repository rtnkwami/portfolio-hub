apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tailnet-argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    external-dns.alpha.kubernetes.io/ttl: "60"
spec:
  parentRefs:
    - name: management-gateway
      namespace: gateway-system
  hostnames:
    - "gitops.internal.niovial.io"
  rules:
    - backendRefs:
      - name: argocd-server
        port: 80