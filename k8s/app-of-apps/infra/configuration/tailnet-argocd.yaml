apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tailnet-argocd
  namespace: argocd
spec:
  parentRefs:
    - name: management-gateway
      namespace: gateway-system
  hostnames:
    - "gitops.internal.niovial.io"
  rules:
    - backendRefs:
      - name: argocd-server
        port: 80