.system-tolerations: &system-tolerations
  tolerations:
    - key: niovial.io/node-purpose
      operator: Equal
      value: system
      effect: NoSchedule

globals:
  destinationServer: https://kubernetes.default.svc
  
  clusterName: homelab
  
  enableIsolation: true

  nodeSelectors:
    niovial.io/node-purpose: system
  
  tolerations:
    - key: niovial.io/node-purpose
      operator: Exists

crds:
  gatewayApi:
    enabled: false
    version: v1.5.1
  
  prometheus:
    enabled: true
    version: 30.0.0

certManager:
  enabled: true
  version: 1.20.2

cnpg:
  enabled: true
  version: 0.28.3

keda:
  enabled: true
  version: 2.20.1

eso:
  enabled: true
  version: 2.6.0

karpenter:
  enabled: true
  version: 1.11.1
  interruptionQueue: karpenter-interruption-queue

externalDns:
  enabled: true
  version: 1.21.1
  config:
    # e.g. cloudflare, aws, gcp, etc.
    provider: ""
    # Any credentials or environment variables used to authenticate to the service provider.
    env: []

nodeExporter:
  enabled: true
  version: 4.55.0

vlogsCollector:
  enabled: true
  version: 0.3.6

apps:
  vmStack:
    enabled: true
    version: 0.81.0
    # expose grafana UI via o11y.[config.gateway.hostname]
    # If gateway is not enabled, this remains inactive
    httpRoute:
      enabled: true
    values:
      prometheus-node-exporter:
        enabled: false
      defaultDatasources:
        extra:
          - name: VictoriaLogs
            type: victoriametrics-logs-datasource
            url: http://vlogs-victoria-logs-single-server:9428
      grafana:
        plugins:
          - victoriametrics-logs-datasource
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
      victoria-metrics-operator:
        admissionWebhooks:
          certManager:
            enabled: true
        nodeSelector:
          niovial.io/node-purpose: system
        <<: *system-tolerations
      alertmanager:
        spec:
          resources:
            requests:
              memory: "256Mi"
              cpu: "125m"
            limits:
              memory: "256Mi"

  vlogs:
    enabled: true
    version: 0.13.5
    values: {}      

config:
  clusterIssuer:
    # Enabling this requires setting operators.certManager.enabled: true
    enabled: false
    # Name of the ClusterIssuer resource
    name: ""
    # Additional annotations to merge onto the resource
    annotations: {}
    # Email for ACME registration and expiry alerts
    email: ""
    # ACME server URL
    # Staging: https://acme-staging-v02.api.letsencrypt.org/directory
    # Production: https://acme-v02.api.letsencrypt.org/directory
    server: ""
    # Name of the Secret where the ACME account private key will be stored
    privateKeySecretRef: ""
    # Solvers configuration — passed through as-is to cert-manager
    # Prerequisites: the Secret referenced by any solver must exist in the
    # cluster before bootstrap runs (e.g. cloudflare-dns-token).
    # This Secret cannot be created by this chart.
    # Example dns01 solver using Cloudflare:
    # solvers:
    #   - dns01:
    #       cloudflare:
    #         apiTokenSecretRef:
    #           name: cloudflare-dns-token
    #           key: token
    solvers: []
  
  clusterSecretStore:
    # Enabling this requires setting operators.eso.enabled: true
    enabled: false
    # Name of the ClusterSecretStore resource
    name: ""
    # Additional annotations to merge onto the resource
    annotations: {}
    # Provider configuration — passed through as-is to external-secrets
    # Prerequisites: any Secret referenced by the provider must exist in the
    # cluster before bootstrap runs. These Secrets cannot be created by this chart.
    # Example using Infisical:
    # provider:
    #   infisical:
    #     hostAPI: https://app.infisical.com
    #     auth:
    #       universalAuthCredentials:
    #         clientId:
    #           name: infisical-credentials
    #           key: clientId
    #           namespace: external-secrets
    #         clientSecret:
    #           name: infisical-credentials
    #           key: clientSecret
    #           namespace: external-secrets
    #     secretsScope:
    #       projectSlug: my-project
    #       environmentSlug: staging
    provider: {}

  gateway:
    enabled: false
    # Name of the Gateway resource
    name: ""
    # The namespace where the Gateway is deployed
    namespace: ""
    # Additional annotations to merge onto the resource
    annotations: {}
    # GatewayClass name. Depends on your provider (e.g. cilium, nginx, istio)
    class: ""
    # Annotations passed through to the infrastructure provider (e.g. cloud load balancer)
    # Prerequisites: these are provider-specific and passed through as-is
    # Example using Hetzner:
    # infrastructureAnnotations:
    #   load-balancer.hetzner.cloud/name: "my-lb"
    #   load-balancer.hetzner.cloud/location: "nbg1"
    #   load-balancer.hetzner.cloud/uses-proxyprotocol: "true"
    infrastructureAnnotations: {}
    # Base hostname for the wildcard listener. E.g. example.io produces *.example.io
    hostname: ""
    # Name of the TLS Secret containing the wildcard certificate
    # This Secret will be created by cert-manager if clusterIssuer is enabled
    tlsSecretName: ""

  # ReferenceGrants permit HTTPRoutes in app namespaces to attach to the
  # Gateway. Each entry creates one ReferenceGrant in the target namespace.
  # Add one entry per namespace that needs to attach routes to the Gateway.
  # Example:
  # referenceGrants:
  #   - name: allow-observability
  #     from: observability  # namespace where the HTTPRoute lives
  #   - name: allow-argocd
  #     from: argocd
  referenceGrants:
    # If referenceGrants is overriden in values, copy the below to allow complete creation
    # of the observability route.
    - name: allow-observability
      from: observability
