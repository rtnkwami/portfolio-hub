{{- if and .Values.eso.enabled .Values.config.clusterSecretStore.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.config.clusterSecretStore.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    {{- with .Values.config.clusterSecretStore.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  provider:
    {{- toYaml .Values.config.clusterSecretStore.provider | nindent 4 }}
{{- end }}