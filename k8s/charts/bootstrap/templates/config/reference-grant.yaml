{{- if .Values.config.referenceGrants }}
{{- range $grant := .Values.config.referenceGrants }}
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: {{ $grant.name }}
  namespace: {{ $.Values.config.gateway.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ $grant.from }}
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
---
{{- end }}
{{- end }}