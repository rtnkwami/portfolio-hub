{{- if .Values.config.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.config.gateway.name }}
  namespace: {{ .Values.config.gateway.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    {{- if .Values.config.clusterIssuer.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.config.clusterIssuer.name }}
    {{- end }}
    {{- with .Values.config.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  gatewayClassName: {{ .Values.config.gateway.class }}
  {{- with .Values.config.gateway.infrastructureAnnotations }}
  infrastructure:
    annotations:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  listeners:
    - name: https
      hostname: "*.{{ .Values.config.gateway.hostname }}"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.config.gateway.tlsSecretName }}
{{- end }}