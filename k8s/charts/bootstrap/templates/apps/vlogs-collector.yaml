{{- if .Values.apps.vlogsCollector.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vlogs-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: victoria-logs-collector
    repoURL: oci://ghcr.io/victoriametrics/helm-charts/victoria-logs-collector
    targetRevision: {{ .Values.apps.vlogsCollector.version }}
    {{- if .Values.apps.vlogsCollector.values }}
    helm:
      valuesObject:
        {{- toYaml .Values.apps.vlogsCollector.values | nindent 8 }}
    {{- end }}
  destination:
    namespace: vlogs-collector
    server: {{ $.Values.globals.destinationServer }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
{{- end }}