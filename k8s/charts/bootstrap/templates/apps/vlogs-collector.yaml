{{- if .Values.vlogsCollector.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vlogs-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: victoria-logs-collector
    repoURL: oci://ghcr.io/victoriametrics/helm-charts/victoria-logs-collector
    targetRevision: {{ .Values.vlogsCollector.version }}
    helm:
      valuesObject:
        remoteWrite:
          - url: http://vlogs-victoria-logs-single-server.observability.svc.cluster.local:9428
        podMonitor:
          enabled: true
        tolerations:
          - operator: Exists
  destination:
    namespace: vlogs-collector
    server: {{ $.Values.globals.destinationServer }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
{{- end }}