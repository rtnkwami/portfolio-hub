{{- if .Values.keda.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: keda
    repoURL: https://kedacore.github.io/charts
    targetRevision: {{ .Values.keda.version }}
    helm:
      valuesObject:
        {{- if .Values.globals.enableIsolation }}
        nodeSelector:
        {{- with .Values.globals.nodeSelectors }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        tolerations:
        {{- with .Values.globals.tolerations }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
        prometheus:
          metricServer:
            enabled: true
            serviceMonitor:
              enabled: true
          operator:
            enabled: true
            serviceMonitor:
              enabled: true
          webhooks:
            enabled: true
            serviceMonitor:
              enabled: true
  destination:
    namespace: keda
    server: {{ $.Values.globals.destinationServer }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
{{- end }}