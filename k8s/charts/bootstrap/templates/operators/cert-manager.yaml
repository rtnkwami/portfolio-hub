{{- if .Values.certManager.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: cert-manager
    repoURL: oci://quay.io/jetstack/charts/cert-manager
    targetRevision: {{ .Values.certManager.version }}
    helm:
      valuesObject:
        global:
        {{- if .Values.globals.enableIsolation }}
          nodeSelector:
          {{- with .Values.globals.nodeSelectors }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
        tolerations:
        {{- with .Values.globals.tolerations }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
        crds:
          enabled: true
        config:
          enableGatewayAPI: true
        {{- with .Values.certManager.resources.controller }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        webhook:
          {{- if .Values.globals.enableIsolation }}
          {{- with .Values.globals.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.certManager.resources.webhook }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        cainjector:
          {{- if .Values.globals.enableIsolation }}
          {{- with .Values.globals.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.certManager.resources.cainjector }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        startupapicheck:
          {{- if .Values.globals.enableIsolation }}
          {{- with .Values.globals.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.certManager.resources.startupapicheck }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        prometheus:
          serviceMonitor:
            enabled: true
  destination:
    namespace: cert-manager
    server: {{ .Values.globals.destinationServer }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
{{- end }}