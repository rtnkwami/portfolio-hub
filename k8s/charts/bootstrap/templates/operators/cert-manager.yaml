{{- if .Values.operators.certManager.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: cert-manager
    repoURL: oci://quay.io/jetstack/charts/cert-manager
    targetRevision: {{ .Values.operators.certManager.version }}
    {{- if .Values.operators.certManager.values }}
    helm:
      valuesObject:
        {{- toYaml .Values.operators.certManager.values | nindent 8 }}
    {{- end }}
  destination:
    namespace: cert-manager
    server: {{ $.Values.globals.destinationServer }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
{{- end }}