{{- if .Values.externalDns.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    targetRevision: {{ .Values.externalDns.version }}
    helm:
      valuesObject:
        {{- if .Values.globals.enableIsolation }}
        nodeSelector:
          {{- with .Values.globals.nodeSelectors }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
        tolerations:
        {{- with .Values.globals.tolerations }}
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- end }}
        sources:
          - service
          - gateway-httproute
          - gateway-tlsroute
          - gateway-tcproute
        rbac:
          additionalPermissions:
            - apiGroups: [""]
              resources: ["namespaces"]
              verbs: ["get","watch","list"]
        serviceMonitor:
          enabled: true
        {{- with .Values.externalDns.config }}
        {{- with .provider }}
        provider:
          name: {{ . }}
        txtOwnerId: {{ $.Values.globals.clusterName }}
        {{- end }}
        {{- with .env }}
        env:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
  destination:
    namespace: external-dns
    server: {{ $.Values.globals.destinationServer }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
{{- end }}