{{- if .Values.cnpg.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: cloudnative-pg
    repoURL: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
    targetRevision: {{ .Values.cnpg.version }}
    helm:
      valuesObject:
        {{- if .Values.globals.enableIsolation }}
        nodeSelector:
        {{- with .Values.globals.nodeSelectors }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        tolerations:
        {{- with .Values.globals.tolerations }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
        monitoring:
          podMonitorEnabled: true
          grafanaDashboard:
            create: true
  destination:
    namespace: cnpg-system
    server: {{ .Values.globals.destinationServer }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
{{- end }}