{{- if .Values.operators.karpenter.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: karpenter
    repoURL: oci://public.ecr.aws/karpenter/karpenter
    targetRevision: {{ .Values.operators.karpenter.version }}
    {{- if .Values.operators.karpenter.values }}
    helm:
      valuesObject:
        {{- toYaml .Values.operators.karpenter.values | nindent 8 }}
    {{- end }}
  destination:
    namespace: kube-system
    server: {{ $.Values.globals.destinationServer }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
{{- end }}