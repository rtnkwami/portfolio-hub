{{- if .Values.karpenter.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: karpenter
    repoURL: oci://public.ecr.aws/karpenter/karpenter
    targetRevision: {{ .Values.karpenter.version }}
    helm:
      valuesObject:
        {{- if .Values.globals.enableIsolation }}
        global:
          nodeSelector:
          {{- with .Values.globals.nodeSelectors }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        settings:
          clusterName: {{ .Values.globals.clusterName }}
          interruptionQueue: {{ .Values.karpenter.interruptionQueue }}
        serviceAccount:
          name: "karpenter"
  destination:
    namespace: kube-system
    server: {{ $.Values.globals.destinationServer }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
{{- end }}