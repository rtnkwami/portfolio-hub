{{- if .Values.operators.eso.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: external-secrets
    repoURL: https://charts.external-secrets.io
    targetRevision: {{ .Values.operators.eso.version }}
    helm:
      valuesObject:
        {{- if .Values.globals.enableIsolation }}
        nodeSelector:
        {{- with .Values.globals.nodeSelectors }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        tolerations:
        {{- with .Values.globals.tolerations }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
  destination:
    namespace: external-dns
    server: {{ $.Values.globals.destinationServer }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
{{- end }}