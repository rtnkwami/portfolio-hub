apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.database.name }}-password
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "31"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  length: 32
  symbols: 0
  digits: 10
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.name }}-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "32"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "2h"
  target:
    # cnpg already creates a secret which we can auto-update
    name: {{ .Values.database.name }}-app
    creationPolicy: Merge
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        password: "{{ `{{ .password }}` }}"
        pgpass: "{{ .Values.database.name }}-rw:5432:app:app:{{ `{{ .password }}` }}"
        jdbc-uri: "jdbc:postgresql://{{ .Values.database.name }}-rw.{{ .Release.Namespace }}:5432/app?password={{ `{{ .password }}` }}&user=app"
        uri: "postgresql://app:{{ `{{ .password }}` }}@{{ .Values.database.name }}-rw.{{ .Release.Namespace }}:5432/app?sslmode=require"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.database.name }}-password
