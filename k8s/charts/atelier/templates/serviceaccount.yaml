{{- range $component, $config := pick .Values.app "frontend" "backend" }}
{{- if $config.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-%s" (include "..fullname" $) $component }}
  labels:
    {{- include "..labels" $ | nindent 4 }}
  {{- with $config.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $config.serviceAccount.automount }}
{{- end }}
{{- end }}