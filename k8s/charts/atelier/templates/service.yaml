{{- range $component, $config := pick .Values.app "frontend" "backend" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" (include "..fullname" $) $component }}
  labels:
    {{- include "..labels" $ | nindent 4 }}
spec:
  type: {{ $config.service.type }}
  ports:
    - port: {{ $config.service.servicePort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "..selectorLabels" $ | nindent 4 }}
    {{- with $config.podLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{ end -}}
