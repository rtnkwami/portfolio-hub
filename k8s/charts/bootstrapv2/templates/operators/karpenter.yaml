{{- if .Values.karpenter.enabled -}}
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: karpenter
  namespace: flux-system
spec:
  interval: 2h
  url: oci://public.ecr.aws/karpenter/karpenter
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: {{ .Values.karpenter.version }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karpenter
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: kube-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
    cleanUpOnFail: true
  chart:
    spec:
      chart: .
      sourceRef:
        kind: OCIRepository
        name: karpenter
        namespace: flux-system
      interval: 2h
  values:
    {{- if .Values.enableOperatorIsolation }}
    nodeSelector:
      niovial.io/node-purpose: system
    {{- end }}
    {{- with .Values.karpenter.values }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end -}}