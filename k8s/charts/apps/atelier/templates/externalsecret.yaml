{{- range $component, $groups := pick $.Values.secrets "backend" "frontend" "database" }}
{{- range $group, $entries := $groups }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-%s-%s" (include "..fullname" $) $component $group }}
  labels:
    {{- include "..labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  refreshInterval: {{ $.Values.secrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.secrets.store.name }}
    kind: {{ $.Values.secrets.store.kind }}
  data:
    {{- range $entries }}
    - secretKey: {{ .envKey }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- with .remoteProperty }}
        property: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}