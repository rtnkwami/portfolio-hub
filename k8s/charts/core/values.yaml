clusterName: homelab

controllers:
  nodePlacement:
    enabled: true
   
    nodeSelector:
      node.niovial.io/pool: system
    
    tolerations:
      - key: node.niovial.io/pool
        operator: Equal
        value: system

spegel:
  enabled: false

secrets:
  provider: infisical
  
  config:
    hostAPI: https://app.infisical.com
    auth:
      universalAuthCredentials:
        clientId:
          name: infisical-credentials
          key: clientId
          namespace: external-secrets
        clientSecret:
          name: infisical-credentials
          key: clientSecret
          namespace: external-secrets
    secretsScope:
      projectSlug: homelab-43la
      environmentSlug: staging

networking:
  gatewayAPI:
    enabled: false

  tls:
    issuer:
      email: cert-alerts@niovial.io
      # environment can either be staging or production
      environment: staging
      # name of secret within external secret manager containing
      # credentials to manage the DNS domain for this cluster
      remoteRef: k8s-certmanager-token

  dns:
    # name of secret within external secret manager containing
      # credentials to manage the DNS domain for this cluster
    remoteRef: k8s-externaldns-token

monitoring:
  storage:
    size:
      metrics: 30Gi
      logs: 20Gi