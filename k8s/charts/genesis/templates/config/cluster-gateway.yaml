apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external-gateway
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    cert-manager.io/cluster-issuer: letsencrypt-{{ .Values.networking.tls.issuer.environment }}
spec:
  gatewayClassName: cilium
  {{- with .Values.networking.externalGateway.infrastructureAnnotations }}
  infrastructure:
    annotations:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  listeners:
    - name: https
      hostname: "*.niovial.io"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: niovial-io-tls