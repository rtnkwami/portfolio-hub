{{- if .Values.networking.tailnet.services.grafana.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: tailnet-grafana
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "90"
    tailscale.com/hostname: grafana
    tailscale.com/proxy-group: service-proxies
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
{{- end }}