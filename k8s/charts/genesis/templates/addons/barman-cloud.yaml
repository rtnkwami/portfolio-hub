apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barman-cloud-plugin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    argocd.argoproj.io/ignore-healthcheck: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    chart: plugin-barman-cloud
    repoURL: oci://ghcr.io/cloudnative-pg/charts/plugin-barman-cloud
    targetRevision: 0.7.0
    helm:
      valuesObject:
        {{- if .Values.controllers.nodePlacement.enabled }}
        {{- with .Values.controllers.nodePlacement.nodeSelector }}
        {{- include "controller.nodeSelector" $ | nindent 8 }}
        {{- end }}
        {{- with .Values.controllers.nodePlacement.tolerations }}
        {{- include "controller.tolerations" $ | nindent 8 }}
        {{- end }}
        {{- end }}
        replicaCount: 2
        topologySpreadConstraints:
          - topologyKey: "topology.kubernetes.io/zone"
            maxSkew: 1
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: barman-cloud-plugin
            matchLabelKeys: ["pod-template-hash"]
  destination:
    namespace: cnpg-system
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true