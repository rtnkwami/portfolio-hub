apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vlogs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    chart: victoria-logs-single
    repoURL: oci://ghcr.io/victoriametrics/helm-charts/victoria-logs-single
    targetRevision: 0.13.5
    helm:
      valuesObject:
        server:
          persistentVolume:
            size: {{ .Values.monitoring.storage.size.logs }}
          serviceMonitor:
            enabled: true
  destination:
    namespace: observability
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true